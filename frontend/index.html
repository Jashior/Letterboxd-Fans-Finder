<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Fans Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #14181c;
        }
        .card {
            background-color: #2c3440;
            border: 1px solid #445566;
        }
        .form-control {
            background-color: #1a2228;
            border-color: #445566;
            color: #fff;
        }
        .form-control:focus {
            background-color: #1a2228;
            border-color: #77b6ff;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, .25);
        }
        .btn-primary {
            background-color: #00b020;
            border-color: #00b020;
        }
        .btn-primary:hover {
            background-color: #00901a;
            border-color: #00901a;
        }
        .poster-img {
            width: 75px;
            height: 112px;
            object-fit: cover;
            border-radius: 4px;
        }
        .fan-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        #results-container .card-header {
            background-color: #445566;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Letterboxd Fans Finder</h1>
                        <form id="fan-finder-form">
                            <div class="input-group mb-3">
                                <span class="input-group-text">letterboxd.com/</span>
                                <input type="text" class="form-control" id="username" placeholder="username" required>
                                <button class="btn btn-primary" type="submit" id="submit-button">Find Fans</button>
                            </div>
                        </form>

                        <div id="status-container" class="mt-4"></div>
                        <div id="results-container" class="mt-4"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('fan-finder-form');
        const usernameInput = document.getElementById('username');
        const submitButton = document.getElementById('submit-button');
        const statusContainer = document.getElementById('status-container');
        const resultsContainer = document.getElementById('results-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            if (!username) return;

            // Reset UI
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Finding...';
            statusContainer.innerHTML = '';
            resultsContainer.innerHTML = '';

            try {
                const response = await fetch('/all_fans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const data = await response.json();
                if (data.job_id) {
                    statusContainer.innerHTML = `<div class="text-center">Job submitted! Polling for results...</div>`;
                    pollJobStatus(data.job_id);
                } else {
                    throw new Error(data.error || 'Failed to start the job.');
                }
            } catch (error) {
                displayError(error.message);
            }
        });

        function pollJobStatus(jobId) {
            fetch(`/results/${jobId}`)
                .then(response => {
                    if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    console.log('Polling status:', data.status);

                    if (data.status === 'finished') {
                        handleFinishedJob(data.result);
                    } else if (data.status === 'failed') {
                        displayError(data.message || 'The background task failed to execute.');
                    } else {
                        // Continue polling for 'queued', 'started', etc.
                        statusContainer.innerHTML = `<div class="text-center">Status: ${data.status}...</div>`;
                        setTimeout(() => pollJobStatus(jobId), 2000);
                    }
                })
                .catch(error => {
                    displayError(`Polling request failed: ${error.message}`);
                });
        }

        function handleFinishedJob(result) {
            const fansAreEmpty = isFanResultEmpty(result.fans);

            if (result.error) {
                displayError(
                    'An error occurred while fetching results from Letterboxd.',
                    result.error
                );
                return;
            }

            if (result.warning) {
                statusContainer.innerHTML = `
                    <div class="alert alert-warning text-center">
                        <strong>Partial results</strong><br>
                        ${result.warning}
                    </div>
                `;
            }

            if (fansAreEmpty && result.scraping_error) {
                // Case 1: Empty results BECAUSE of a scraping error
                displayError(
                    'An error occurred while fetching results from Letterboxd.',
                    'This can happen due to rate-limiting, Cloudflare blocking, or a change in Letterboxd markup. Please try again later.'
                );
            } else if (fansAreEmpty) {
                // Case 2: Empty results because no one matched
                statusContainer.innerHTML = '';
                resultsContainer.innerHTML = `
                    <div class="alert alert-info text-center">
                        <h4>Search Complete</h4>
                        <p class="mb-0">No matching fans were found.</p>
                    </div>
                `;
                resetForm();
            } else {
                // Case 3: Success! We have results to show.
                statusContainer.innerHTML = '';
                displayResults(result);
                resetForm();
            }
        }

        function displayResults(result) {
            // Display Favorite Films
            let favoritesHtml = '<h3 class="mb-3">Favorite Films</h3><div class="d-flex flex-wrap gap-2 mb-4">';
            const movieMap = new Map(result.movies.map(m => [m.code, m]));
            result.movies.forEach(movie => {
                favoritesHtml += `<img src="${movie.url}" alt="${movie.name}" title="${movie.name}" class="poster-img">`;
            });
            favoritesHtml += '</div>';

            // Display Fans
            let fansHtml = '';
            const sortedComboSizes = Object.keys(result.fans).sort((a, b) => b - a);

            for (const comboSize of sortedComboSizes) {
                const combinations = result.fans[comboSize];
                if (combinations.length > 0) {
                    fansHtml += `
                        <div class="card mb-3">
                            <div class="card-header">
                                Fans of ${comboSize} common movies
                            </div>
                            <div class="card-body">
                    `;
                    combinations.forEach(combo => {
                        fansHtml += '<div class="mb-3">';
                        fansHtml += '<div class="d-flex flex-wrap gap-1 mb-2">';
                        combo.movies.forEach(movieSlug => {
                            const movie = movieMap.get(movieSlug);
                            if (movie) {
                                fansHtml += `<span class="badge bg-secondary">${movie.name.replace(/\s\(\d{4}\)$/, '')}</span>`;
                            }
                        });
                        fansHtml += '</div>';

                        fansHtml += '<ul class="list-group">';
                        combo.fans.forEach(fan => {
                            fansHtml += `
                                <li class="list-group-item d-flex align-items-center">
                                    <img src="${fan.picture_link}" alt="${fan.name}" class="fan-avatar me-3">
                                    <div>
                                        <a href="https://letterboxd.com/${fan.username}/" target="_blank" class="text-decoration-none">${fan.name}</a>
                                        <small class="d-block text-muted">@${fan.username}</small>
                                    </div>
                                </li>
                            `;
                        });
                        fansHtml += '</ul>';

                        if (combo.more_results) {
                            fansHtml += '<small class="text-muted mt-1 d-block">More results may be available on Letterboxd.</small>';
                        }
                        fansHtml += '</div>';
                    });
                    fansHtml += '</div></div>';
                }
            }
            resultsContainer.innerHTML = favoritesHtml + fansHtml;
        }

        function displayError(message, subMessage = '') {
            statusContainer.innerHTML = '';
            let subMessageHtml = subMessage ? `<p class="mb-0 small">${subMessage}</p>` : '';
            resultsContainer.innerHTML = `
                <div class="alert alert-danger text-center">
                    <h4>Error</h4>
                    <p>${message}</p>
                    ${subMessageHtml}
                </div>
            `;
            resetForm();
        }

        function resetForm() {
            submitButton.disabled = false;
            submitButton.innerHTML = 'Find Fans';
        }

        /**
         * A helper function to check if the fans object from the API is empty.
         * It checks if the object is null, has no keys, or if all its arrays are empty.
         */
        function isFanResultEmpty(fans) {
            if (!fans || Object.keys(fans).length === 0) {
                return true;
            }
            // Returns true only if every combination list inside is empty.
            return Object.values(fans).every(comboList => comboList.length === 0);
        }

        // Check for a job ID in the URL on page load (for deep linking/sharing)
        // Example: /?job_id=some-uuid
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('job_id');
            if (jobId) {
                // You might want to disable the form while a job is loading from URL
                submitButton.disabled = true;
                statusContainer.innerHTML = `<div class="text-center">Loading results for job: ${jobId}</div>`;
                pollJobStatus(jobId);
            }
        });

    </script>
</body>
</html>
